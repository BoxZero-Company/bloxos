
# ============================================================
# BloxOS 27H1 Horizon
# Unified UEFI / GRUB Boot Configuration
# ============================================================

# -------------------- GLOBAL SETTINGS -----------------------

set default=0
set timeout=10
set timeout_style=menu
set fallback=1

set gfxmode=1024x768,800x600,auto
set gfxpayload=keep

set pager=1
set color_normal=white/black
set color_highlight=black/light-green

export default
export timeout
export gfxmode
export gfxpayload

# -------------------- SYSTEM INFORMATION --------------------

set os_name="BloxOS"
set os_version="27H1 Horizon"
set os_codename="Horizon"
set kernel_path="/boot/kernel.elf"
set boot_mode="UEFI"
set boot_arch="x86_64"

# -------------------- MODULE CONFIGURATION ------------------

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf
insmod normal
insmod configfile
insmod multiboot2
insmod search
insmod search_fs_file
insmod all_video
insmod gfxterm
insmod png
insmod echo
insmod test
insmod reboot
insmod halt
insmod linux
insmod memdisk

# -------------------- GRAPHICAL TERMINAL -------------------

if loadfont unicode; then
    terminal_output gfxterm
fi

# -------------------- HEADER -------------------------------

function show_header {
    clear
    echo ""
    echo "============================================================"
    echo "                  B L O X O S"
    echo "                  27H1 HORIZON"
    echo "============================================================"
    echo ""
    echo "             Next Generation Operating System"
    echo ""
    echo "------------------------------------------------------------"
}

# -------------------- SYSTEM CHECK --------------------------

function system_information {
    echo ""
    echo "System: ${os_name} ${os_version}"
    echo "Architecture: ${boot_arch}"
    echo "Boot mode: ${boot_mode}"
    echo ""
}

# -------------------- KERNEL VALIDATION ---------------------

function check_kernel {
    if [ -f ${kernel_path} ]; then
        return 0
    else
        echo ""
        echo "[ERROR] Kernel file not found!"
        echo "Expected: ${kernel_path}"
        return 1
    fi
}

# -------------------- NORMAL BOOT ---------------------------

menuentry "BloxOS 27H1 Horizon - Start System" --id bloxos-normal {
    show_header
    system_information

    echo "[1/3] Checking boot files..."

    if ! check_kernel; then
        echo ""
        echo "Press any key to return..."
        read
        return
    fi

    echo "[2/3] Loading Multiboot2 kernel..."
    echo "[3/3] Transferring control to kernel..."

    sleep 2

    multiboot2 ${kernel_path}
    boot
}

# -------------------- RECOVERY MODE -------------------------

menuentry "Recovery Mode" --id bloxos-recovery {
    show_header

    echo "BloxOS Recovery Environment"
    echo "---------------------------"
    echo ""
    echo "Recovery mode is a boot entry."
    echo "A dedicated recovery environment must"
    echo "be implemented in the kernel."
    echo ""

    if check_kernel; then
        multiboot2 ${kernel_path}
        boot
    fi

    echo "Kernel unavailable."
    sleep 5
}

# -------------------- SAFE BOOT -----------------------------

menuentry "Safe Boot" --id bloxos-safe {
    show_header

    echo "Safe Boot"
    echo "---------"
    echo ""
    echo "Starting kernel with diagnostic intent."
    echo "Kernel-level safe mode is not yet implemented."
    echo ""

    if check_kernel; then
        multiboot2 ${kernel_path}
        boot
    fi

    echo "Kernel unavailable."
    sleep 5
}

# -------------------- BOOT DIAGNOSTICS ----------------------

menuentry "Boot Diagnostics" --id bloxos-diagnostics {
    show_header

    echo "BloxOS Boot Diagnostics"
    echo "-----------------------"
    echo ""
    echo "Architecture: ${boot_arch}"
    echo "Boot mode: ${boot_mode}"
    echo "Kernel path: ${kernel_path}"
    echo ""

    if check_kernel; then
        echo "[OK] Kernel file exists."
    else
        echo "[FAIL] Kernel file missing."
    fi

    echo ""
    echo "GRUB version: ${grub_version}"
    echo ""
    echo "Press ESC to return."
    sleep 10
}

# -------------------- KERNEL INFORMATION --------------------

menuentry "Kernel Information" --id bloxos-kernel-info {
    show_header

    echo "Kernel Information"
    echo "------------------"
    echo ""
    echo "File: ${kernel_path}"
    echo "Format: ELF64"
    echo "Architecture: x86_64"
    echo "Boot protocol: Multiboot2"
    echo ""
    echo "Press any key to return."
    read
}

# -------------------- BOOT OPTIONS --------------------------

menuentry "Boot Options" --id bloxos-boot-options {
    show_header

    echo "Boot Configuration"
    echo "------------------"
    echo ""
    echo "Default entry: ${default}"
    echo "Timeout: ${timeout}"
    echo "Graphics: ${gfxmode}"
    echo "Payload: ${gfxpayload}"
    echo ""
    echo "These values are configured in GRUB."
    echo "Kernel runtime options require kernel support."
    echo ""
    sleep 8
}

# -------------------- MULTIBOOT2 SETTINGS -------------------

menuentry "Multiboot2 Information" --id bloxos-multiboot-info {
    show_header

    echo "Multiboot2 Boot Information"
    echo "---------------------------"
    echo ""
    echo "Boot protocol: Multiboot2"
    echo "Kernel: ${kernel_path}"
    echo "Architecture: x86_64"
    echo ""
    echo "GRUB transfers control using Multiboot2."
    echo "Memory map handling must be implemented"
    echo "inside the kernel."
    echo ""
    sleep 8
}

# -------------------- BOOT HELP -----------------------------

menuentry "Boot Help" --id bloxos-help {
    show_header

    echo "BloxOS Boot Help"
    echo "----------------"
    echo ""
    echo "Start System:"
    echo "    Starts the BloxOS kernel."
    echo ""
    echo "Recovery Mode:"
    echo "    Reserved for recovery environment."
    echo ""
    echo "Safe Boot:"
    echo "    Reserved for minimal kernel startup."
    echo ""
    echo "Diagnostics:"
    echo "    Checks boot files."
    echo ""
    echo "Kernel Information:"
    echo "    Displays kernel metadata."
    echo ""
    sleep 12
}

# -------------------- RESTART -------------------------------

menuentry "Restart Computer" --id bloxos-reboot {
    reboot
}

# -------------------- SHUTDOWN ------------------------------

menuentry "Power Off" --id bloxos-poweroff {
    halt
}

# -------------------- END -----------------------------------

echo ""
echo "BloxOS 27H1 Horizon Boot Manager initialized."
